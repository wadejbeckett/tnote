<!doctype html>
<html><head><meta charset="utf-8"><title>Note</title>
<style>
  :root { color-scheme: light dark; }
  body { font: menu; margin: 12px; display: flex; flex-direction: column; gap: 8px; min-width: 360px; max-width: 640px; }
  #subject { opacity: .7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  textarea { min-height: 140px; font: inherit; resize: none; padding: 6px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  #del { margin-right: auto; }
  #status:empty { display: none; }
  #back { color: #2E8B57; text-decoration: none; }
  #back:hover { text-decoration: underline; }
  body.empty #subject, body.empty textarea, body.empty .row { display: none; }
</style></head>
<body>
  <a id="back" href="list.html" hidden>← All notes</a>
  <div id="subject"></div>
  <textarea id="text" disabled aria-label="Note" placeholder="Why is this message the way it is?"></textarea>
  <div id="status" role="status"></div>
  <div class="row"><button id="del" hidden>Delete note</button><button id="done">Done</button></div>
  <script src="note.js"></script>
</body></html>
